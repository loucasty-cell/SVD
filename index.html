    <script>
      // Intercept and swallow benign sandbox Vite HMR WebSocket connection failure errors
      (function() {
        if (typeof window !== 'undefined') {
          // Suppress unhandled promise rejections originating from WebSocket closure
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var str = String(reason || '') + ' ' + String((reason && reason.message) || '') + ' ' + String((reason && reason.stack) || '');
            if (str.toLowerCase().indexOf('websocket') !== -1 || str.toLowerCase().indexOf('closed without opened') !== -1 || str.toLowerCase().indexOf('failed to connect to websocket') !== -1) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          }, true);

          // Suppress window error events for WebSocket connection issues
          window.addEventListener('error', function(event) {
            var msg = String(event.message || '') + ' ' + String(event.error || '');
            if (msg.toLowerCase().indexOf('websocket') !== -1 || msg.toLowerCase().indexOf('closed without opened') !== -1 || msg.toLowerCase().indexOf('failed to connect to websocket') !== -1) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          }, true);

          // Filter console.error and console.warn specifically for Vite websocket messages
          var origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var fullMsg = args.map(function(a) { return String(a); }).join(' ');
            if (fullMsg.indexOf('[vite] failed to connect to websocket') !== -1 || fullMsg.indexOf('closed without opened') !== -1) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };

          var origConsoleWarn = console.warn;
          console.warn = function() {
            var args = Array.prototype.slice.call(arguments);
            var fullMsg = args.map(function(a) { return String(a); }).join(' ');
            if (fullMsg.indexOf('[vite] failed to connect to websocket') !== -1 || fullMsg.indexOf('closed without opened') !== -1) {
              return;
            }
            origConsoleWarn.apply(console, arguments);
          };
        }
      })();

      // Defensive setter patch for environments where window.fetch has only a getter
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Pass silently if already configured
        }
      })();
    </script>
